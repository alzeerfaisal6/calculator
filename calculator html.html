<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آلة حاسبة</title>
<style>
body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0}
.calculator{background:white;padding:20px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.2)}
#display{width:100%;height:60px;font-size:24px;text-align:right;margin-bottom:10px;padding:10px;box-sizing:border-box}
.buttons{display:grid;grid-template-columns:repeat(4,70px);gap:10px}
button{height:60px;font-size:22px;border:none;border-radius:10px;cursor:pointer}
.equal{background:#4CAF50;color:white}
.clear{background:#f44336;color:white}
</style>
</head>
<body>
<div class="calculator">
<input type="text" id="display" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="appendValue('/')">÷</button>
<button onclick="appendValue('*')">×</button>
<button onclick="appendValue('-')">−</button>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button onclick="appendValue('+')">+</button>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button onclick="appendValue('.')">.</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button class="equal" onclick="calculate()">=</button>
<button onclick="appendValue('0')" style="grid-column:span 4;">0</button>
</div>
</div>
<script>
function appendValue(v){document.getElementById('display').value+=v;}
function clearDisplay(){document.getElementById('display').value='';}
function calculate(){
try{document.getElementById('display').value=eval(document.getElementById('display').value);}
catch{document.getElementById('display').value='خطأ';}
}
</script>
</body>
</html>
